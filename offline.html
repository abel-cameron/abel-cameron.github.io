<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#101013" />
<title>Offline — CABEL</title>
<style>
  /* Self-contained by necessity: this page is served by the worker with no
     bundle behind it, so the theme tokens are copied rather than imported.
     Keep the values in step with packages/db/style.css. */
  :root {
    --bg: #101013;
    --panel: #18181c;
    --line: #2e2e38;
    --ink: #ecebe5;
    --muted: #76767f;
    --accent: #e08a3e;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.6 ui-sans-serif, system-ui, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  main { width: 100%; max-width: 460px; }
  .brand {
    font: 500 13px/1 ui-monospace, monospace;
    letter-spacing: 0.22em;
    color: var(--accent);
    margin-bottom: 28px;
  }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; }
  p.sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .panel {
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--panel);
    padding: 20px;
  }
  button {
    font: inherit;
    font-weight: 600;
    border-radius: 8px;
    border: none;
    padding: 10px 14px;
    background: var(--accent);
    color: #08080a;
    cursor: pointer;
  }
</style>
<main>
  <div class="brand">CABEL</div>
  <h1>You're offline</h1>
  <p class="sub">CABEL needs a connection to read or save anything.</p>
  <div class="panel">
    <p style="margin: 0 0 16px; color: var(--muted); font-size: 14px">
      Your sign-in is still stored on this device, so you won't need a new link
      once you're back.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</main>
